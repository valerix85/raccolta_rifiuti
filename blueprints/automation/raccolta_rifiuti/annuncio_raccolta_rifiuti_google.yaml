# Blueprint realizzato da domoticafacile.it per l'integrazione Raccolta Rifiuti.
blueprint:
  name: Annuncio raccolta rifiuti con Google Home
  description: >
    Annuncia cosa verrà raccolto domani, ogni sera a uno o due orari specificati,
    usando Google Home.
  domain: automation
  source_url: https://github.com/valerix85/raccolta_rifiuti/blob/main/blueprints/automation/raccolta_rifiuti/annuncio_raccolta_rifiuti_google.yaml
  homeassistant:
    min_version: 2024.8.0
  input:
    sensore_raccolta:
      name: Sensore raccolta rifiuti
      description: Con la configurazione da interfaccia scegli il sensore "Domani".
      selector:
        entity:
          domain: sensor
    dispositivo_google:
      name: Dispositivo Google (media_player)
      selector:
        entity:
          domain: media_player
    motore_tts:
      name: Motore di sintesi vocale (TTS)
      description: >
        Es. tts.google_translate_it_com (Google Translate), tts.home_assistant_cloud,
        tts.piper. Il vecchio servizio tts.google_translate_say non esiste più
        se Google Translate è configurato da interfaccia.
      selector:
        entity:
          domain: tts
    orario_annuncio_1:
      name: Primo orario dell'annuncio
      selector:
        time: {}
      default: "20:00:00"
    abilita_secondo_orario:
      name: Abilita secondo orario
      selector:
        boolean: {}
      default: false
    orario_annuncio_2:
      name: Secondo orario dell'annuncio
      selector:
        time: {}
      default: "20:30:00"
    volume_pre_annuncio:
      name: Volume prima dell'annuncio
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
      default: 0.6
    volume_post_annuncio:
      name: Volume dopo l'annuncio
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
      default: 0.3

trigger:
  - platform: time
    at: !input orario_annuncio_1
    id: primo_annuncio
  - platform: time
    at: !input orario_annuncio_2
    id: secondo_annuncio

variables:
  sensore: !input sensore_raccolta
  secondario_attivo: !input abilita_secondo_orario

condition:
  - condition: template
    value_template: >
      {{ (state_attr(sensore, 'collection_types') or []) | length > 0 }}
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ trigger.id == 'primo_annuncio' }}"
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'secondo_annuncio' }}"
          - condition: template
            value_template: "{{ secondario_attivo }}"

action:
  - variables:
      raccolta: "{{ state_attr(sensore, 'collection_types') or [] }}"
      tipi: >
        {% if raccolta | length > 1 %}
          {{ raccolta[:-1] | join(', ') }} e {{ raccolta[-1] }}
        {% elif raccolta | length == 1 %}
          {{ raccolta[0] }}
        {% endif %}
      messaggio: >
        {% if raccolta | length > 0 %}Domani si raccoglie: {{ tipi | trim }}.{% else %}Domani non c'è nessuna raccolta.{% endif %}

  - service: media_player.volume_set
    data:
      entity_id: !input dispositivo_google
      volume_level: !input volume_pre_annuncio

  - service: tts.speak
    target:
      entity_id: !input motore_tts
    data:
      media_player_entity_id: !input dispositivo_google
      message: "{{ messaggio }}"

  - delay: 5

  - service: media_player.volume_set
    data:
      entity_id: !input dispositivo_google
      volume_level: !input volume_post_annuncio

mode: single
