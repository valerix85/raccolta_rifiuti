# Equivalente delle notifiche del package HassioHelp:
# ore 19:00 la sera prima -> Telegram (2 chat), Echo Cucina (Alexa Devices), script.my_notify
# Da incollare in Impostazioni > Automazioni > nuova > Modifica in YAML.
# Verifica l'entity_id del notificatore "Parla"/"Annuncio" dell'Echo
# (Impostazioni > Dispositivi > Echo Cucina > Notificatori > ingranaggio).
alias: Avviso raccolta differenziata
description: La sera prima della raccolta avvisa cosa esporre
triggers:
  - trigger: time
    at: "19:00:00"
conditions:
  - condition: template
    value_template: >-
      {{ (state_attr('sensor.raccolta_differenziata_domani', 'collection_types') or []) | length > 0 }}
actions:
  - variables:
      # Avviata a mano ("Esegui azioni") o da Alexa, le condizioni vengono
      # saltate: in quel caso, se non c'è nulla, lo dice.
      testo: >-
        {% set m = state_attr('sensor.raccolta_differenziata_domani', 'message') %}
        {{ 'Domani ritirano: ' ~ m if m else "Domani non c'è nessuna raccolta" }}
  - action: notify.telegram_spazza
    continue_on_error: true
    data:
      title: "*Differenziata*"
      message: "{{ testo }}"
  - action: notify.telegram_spazza2
    continue_on_error: true
    data:
      title: "*Differenziata*"
      message: "{{ testo }}"
  # Echo con l'integrazione ufficiale "Alexa Devices": notificatore "Parla"
  # (per il suono di avviso usa quello "Annuncio").
  - action: notify.send_message
    continue_on_error: true
    target:
      entity_id: notify.echo_cucina_speak
    data:
      message: "{{ testo }}"
  # Altoparlante Google/Nest (se presente): tts.speak funziona solo con
  # media player che riproducono file audio, NON con gli Echo.
  # - action: tts.speak
  #   continue_on_error: true
  #   target:
  #     entity_id: tts.home_assistant_cloud
  #   data:
  #     media_player_entity_id: media_player.salotto
  #     message: "{{ testo }}"
  - action: script.my_notify
    continue_on_error: true
    data:
      title: Differenziata
      message: "{{ testo }}"
mode: single
